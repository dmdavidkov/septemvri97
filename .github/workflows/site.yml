name: Site

on:
  # Every commit to main is tested and published.
  push:
    branches: [main]
  # Every 3 hours from 05:15 to 20:15 UTC: the BFB schedule (committed if it changed), the Facebook posts and the
  # Stripe totals.
  # Every 30 minutes at :25 and :55: the Facebook posts (each run can add only the newest one), the Stripe
  # donation totals, and BFB only for teams playing around then, so BFB TV links and final scores show up quickly.
  # A scheduled run publishes only if something changed.
  schedule:
    - cron: '15 5-20/3 * * *'
    - cron: '25,55 * * * *'
  # "Run workflow" button in the Actions tab: refresh the schedule and publish now.
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
      scrape: ${{ steps.scrape.outcome }}
      posts_changed: ${{ steps.posts.outputs.changed }}
      posts: ${{ steps.posts.outcome }}
      stripe_changed: ${{ steps.stripe.outputs.changed }}
      stripe: ${{ steps.stripe.outcome }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A failing test stops the run, so a broken site is never published.
      - run: npm test

      - name: Update the schedule from BFB
        id: scrape
        if: github.event_name != 'push'
        continue-on-error: true
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          if [ "$SCHEDULE" = '25,55 * * * *' ]; then npm run scrape -- --soon; else npm run scrape; fi

      # Pushes made with GITHUB_TOKEN don't start another run, so this can't loop.
      - name: Commit the new schedule
        id: commit
        if: github.event_name != 'push'
        run: |
          git add site/data/games.json site/assets/logos/bfb
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Обновена програма от БФБ"
          git pull --rebase
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"

      # Posts and their photos go only into the published site, never into the public repository.
      - name: Copy the latest Facebook posts
        id: posts
        continue-on-error: true
        env:
          # Repository variable: links of posts the site must not show (wiki: Новини от Facebook).
          FB_HIDE: ${{ vars.FB_HIDE }}
          # Temporary secret for filling the site after a gap (CLAUDE.md). Delete it after one run.
          FB_SEED: ${{ secrets.FB_SEED }}
        run: npm run posts

      # Card donations per cause, added to "Събрано €" on the site. A total per link only, published, never committed.
      - name: Add up the Stripe donations
        id: stripe
        continue-on-error: true
        env:
          # Restricted key with read access (wiki: Stripe). Without it the step does nothing.
          STRIPE_KEY: ${{ secrets.STRIPE_KEY }}
        run: npm run stripe

      # Link previews of shared matches (site/m/), drawn with the runner's Chrome. Published only, never committed.
      - name: Make the match link previews
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true' || steps.posts.outputs.changed == 'true' || steps.stripe.outputs.changed == 'true'
        continue-on-error: true
        run: npm run cards

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'schedule' || steps.commit.outputs.changed == 'true' || steps.posts.outputs.changed == 'true' || steps.stripe.outputs.changed == 'true'
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'schedule' || needs.build.outputs.changed == 'true' || needs.build.outputs.posts_changed == 'true' || needs.build.outputs.stripe_changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs after publishing whatever did update, so one broken part doesn't hold back the rest.
  # A red run here makes GitHub email the repo owner. Facebook can be unreadable for hours, so on
  # scheduled runs its errors turn the run red only once a day, on the first BFB run (05:15 UTC). So do Stripe's,
  # which usually mean the key was deleted or lacks a permission. BFB errors turn it red on the 3-hourly runs
  # only, not on the quick 30-minute checks.
  report:
    needs: [build, deploy]
    if: always() && (needs.build.outputs.scrape == 'failure' || needs.build.outputs.posts == 'failure' || needs.build.outputs.stripe == 'failure')
    runs-on: ubuntu-latest
    steps:
      - if: needs.build.outputs.scrape == 'failure'
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "::error::The BFB update failed for at least one team; its previous games were kept. See the 'Update the schedule from BFB' step."
          if [ "$SCHEDULE" != '25,55 * * * *' ]; then exit 1; fi
      - if: needs.build.outputs.posts == 'failure'
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "::error::The Facebook page could not be read; the site kept the previous posts. See the 'Copy the latest Facebook posts' step."
          if [ "$EVENT" != schedule ] || { [ "$SCHEDULE" = '15 5-20/3 * * *' ] && [ "$(date -u +%H)" -lt 8 ]; }; then exit 1; fi
      - if: needs.build.outputs.stripe == 'failure'
        env:
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          echo "::error::Stripe could not be read; the site kept the previous totals. See the 'Add up the Stripe donations' step."
          if [ "$EVENT" != schedule ] || { [ "$SCHEDULE" = '15 5-20/3 * * *' ] && [ "$(date -u +%H)" -lt 8 ]; }; then exit 1; fi
